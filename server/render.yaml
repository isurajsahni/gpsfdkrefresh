# Run this on a paid instance in the Singapore region: the free tier sleeps
# (30–60 s cold starts) and a far region adds ~1 s to every request from India.
# See "Hosting the API on Render" in the README.
services:
  - type: web
    name: gpsfdk-api
    env: node
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      # Shared secret for the inbound Shiprocket tracking webhook. Without it the
      # route fails closed (500) and no tracking update ever lands.
      - key: SHIPROCKET_WEBHOOK_SECRET
        sync: false
